<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Theory — for UX/UI Designers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
============================================================ */
:root{
  --black:#000000;
  --text:#000000;
  --text-secondary:#666666;
  --text-muted:#8A8A8A;
  --bg:#FFFFFF;
  --bg-soft:#F7F7F7;
  --border:#EAEAEA;
  --border-strong:#D6D6D6;
  --success:#16A34A;
  --warning:#F59E0B;
  --error:#DC2626;
  --info:#2563EB;
  --r-sm:6px;
  --r-md:10px;
  --r-lg:16px;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.disp{font-family:'Inter Tight','Inter',sans-serif;}
h1,h2,h3,h4{margin:0; font-family:'Inter Tight','Inter',sans-serif;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit; text-decoration:none;}
::selection{background:#000; color:#fff;}
:focus-visible{outline:2px solid #000; outline-offset:3px; border-radius:4px;}
button:focus-visible, [tabindex]:focus-visible{outline:2px solid #000; outline-offset:2px;}

.app{min-height:100vh; padding-bottom:0;}
.wrap{max-width:1180px; margin:0 auto; padding:0 32px;}
@media(max-width:767px){.wrap{padding:0 20px;}}

/* ============================================================
   NAV
============================================================ */
.topnav{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.86);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  height:64px;
}
.topnav .wrap{height:100%; display:flex; align-items:center; justify-content:space-between;}
.brand{font-weight:800; font-size:15px; letter-spacing:.02em; display:flex; align-items:center; gap:8px;}
.brand-dot{width:8px;height:8px;border-radius:50%;background:#000;}
.nav-center{display:flex; gap:4px; position:absolute; left:50%; transform:translateX(-50%);}
.nav-link{
  padding:8px 14px; font-size:13.5px; font-weight:500; color:var(--text-secondary);
  border-radius:999px; transition:all .2s var(--ease); position:relative;
}
.nav-link:hover{color:var(--text); background:var(--bg-soft);}
.nav-link.active{color:#fff; background:#000;}
.nav-right{display:flex; align-items:center; gap:18px;}
.nav-xp{font-size:12.5px; font-weight:600; color:var(--text-secondary); display:flex; align-items:center; gap:6px;}
.nav-xp b{color:#000;}
.avatar{
  width:32px;height:32px;border-radius:50%; background:#000; color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
}
@media(max-width:900px){.nav-center{display:none;}}

.bottomnav{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:rgba(255,255,255,.94); backdrop-filter:blur(10px);
  border-top:1px solid var(--border); padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}
@media(max-width:767px){
  .bottomnav{display:flex; justify-content:space-around;}
  .app{padding-bottom:70px;}
}
.bn-item{
  display:flex; flex-direction:column; align-items:center; gap:4px; flex:1;
  padding:6px 0; font-size:10.5px; font-weight:600; color:var(--text-muted);
}
.bn-item.active{color:#000;}
.bn-dot{width:5px;height:5px;border-radius:50%; background:currentColor; opacity:0;}
.bn-item.active .bn-dot{opacity:1;}

/* ============================================================
   TYPE / LAYOUT HELPERS
============================================================ */
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted);}
.headline-xl{font-size:clamp(48px,9vw,104px); font-weight:800; line-height:.98; letter-spacing:-.03em;}
.headline-lg{font-size:clamp(32px,5vw,52px); font-weight:800; line-height:1.02; letter-spacing:-.02em;}
.headline-md{font-size:clamp(24px,3vw,34px); font-weight:700; letter-spacing:-.01em; line-height:1.1;}
.body-lg{font-size:18px; line-height:1.55; color:var(--text-secondary); font-weight:400;}
.body-md{font-size:15px; line-height:1.6; color:var(--text-secondary);}
.mono-num{font-variant-numeric:tabular-nums;}

.btn{
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  padding:13px 24px; font-size:14.5px; font-weight:600; border-radius:999px;
  border:1px solid transparent; transition:all .2s var(--ease); white-space:nowrap;
}
.btn-primary{background:#000; color:#fff;}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 8px 20px rgba(0,0,0,.18);}
.btn-secondary{background:#fff; color:#000; border-color:var(--border-strong);}
.btn-secondary:hover{border-color:#000; background:var(--bg-soft);}
.btn-ghost{background:transparent; color:var(--text-secondary); padding:10px 6px;}
.btn-ghost:hover{color:#000;}
.btn-sm{padding:9px 16px; font-size:13px;}
.btn:disabled{opacity:.35; cursor:not-allowed; transform:none !important;}

.card{background:#fff; border:1px solid var(--border); border-radius:var(--r-lg); padding:24px;}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); border:1px solid var(--border); padding:5px 10px; border-radius:999px;}

.progress-track{height:4px; background:var(--border); border-radius:999px; overflow:hidden; position:relative;}
.progress-fill{height:100%; background:#000; border-radius:999px; transition:width .6s var(--ease);}
.progress-track.thick{height:8px;}

section{padding:100px 0;}
@media(max-width:767px){section{padding:56px 0;}}
.section-head{margin-bottom:48px;}
.divider{height:1px; background:var(--border); border:none; margin:0;}

.reveal{opacity:0; transform:translateY(16px); transition:opacity .6s var(--ease), transform .6s var(--ease);}
.reveal.in{opacity:1; transform:none;}

/* Swatch */
.swatch{border-radius:var(--r-sm); border:1px solid rgba(0,0,0,.08);}

/* Slider */
.field-label{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; margin-bottom:8px;}
.field-label .val{color:var(--text-muted); font-weight:600; font-variant-numeric:tabular-nums;}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:999px; background:var(--border); outline-offset:6px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#000; border:3px solid #fff;
  box-shadow:0 0 0 1px var(--border-strong); cursor:pointer; margin-top:0;
}
input[type=range]::-moz-range-thumb{
  width:18px; height:18px; border-radius:50%; background:#000; border:3px solid #fff; box-shadow:0 0 0 1px var(--border-strong); cursor:pointer;
}
.slider-row{margin-bottom:20px;}

/* Buttons group */
.seg{display:flex; flex-wrap:wrap; gap:8px;}
.seg-btn{padding:9px 15px; font-size:13px; font-weight:600; border:1px solid var(--border-strong); border-radius:999px; background:#fff; color:var(--text-secondary); transition:all .15s;}
.seg-btn:hover{border-color:#000;}
.seg-btn.active{background:#000; color:#fff; border-color:#000;}

.readout{display:flex; gap:10px; flex-wrap:wrap;}
.readout .box{border:1px solid var(--border); border-radius:var(--r-sm); padding:10px 14px; flex:1; min-width:90px;}
.readout .box .k{font-size:10.5px; font-weight:700; letter-spacing:.08em; color:var(--text-muted); text-transform:uppercase;}
.readout .box .v{font-size:14.5px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums;}

/* ============================================================
   LANDING
============================================================ */
.hero{min-height:calc(100svh - 64px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 24px;}
.hero-eyebrow{margin-bottom:22px;}
.hero-head{margin-bottom:26px;}
.hero-body{max-width:480px; margin:0 auto 40px;}
.hero-ctas{display:flex; gap:14px; margin-bottom:64px;}
@media(max-width:520px){.hero-ctas{flex-direction:column; width:100%; max-width:280px;}}

.hero-orb-wrap{width:180px; height:180px; position:relative; cursor:pointer;}
.hero-orb{
  width:100%; height:100%; border-radius:50%; background:#000; transition:background .25s ease, transform .3s var(--ease), box-shadow .3s ease;
  display:flex; align-items:center; justify-content:center;
}
.hero-orb:hover{transform:scale(1.03);}
.hero-orb-label{color:#fff; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.75; pointer-events:none;}
.hero-split{display:flex; gap:10px; justify-content:center; align-items:center; opacity:0; transition:opacity .4s ease;}
.hero-split.show{opacity:1;}
.hero-split .sw{width:34px; height:34px; border-radius:50%; transition:transform .4s var(--ease); border:1px solid rgba(0,0,0,.08);}

.section-eyebrow{text-align:center; margin-bottom:14px;}
.landing-sections{}
.feature-row{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden;}
@media(max-width:767px){.feature-row{grid-template-columns:1fr;}}
.feature-cell{background:#fff; padding:36px 28px;}
.feature-cell .num{font-size:11px; font-weight:700; color:var(--text-muted); letter-spacing:.08em; margin-bottom:14px;}
.feature-cell h3{font-size:19px; margin-bottom:8px;}
.feature-cell p{font-size:14px; color:var(--text-secondary); line-height:1.55;}

.step-flow{display:flex; align-items:center; gap:0; flex-wrap:wrap; justify-content:center; margin-top:20px;}
.step-flow .sf-item{font-size:12.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:8px 16px; border:1px solid var(--border); border-radius:999px;}
.step-flow .sf-arrow{color:var(--text-muted); margin:0 6px; font-size:14px;}

.final-cta{text-align:center; padding:100px 0;}

/* ============================================================
   DASHBOARD
============================================================ */
.dash-hero{display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:40px; flex-wrap:wrap;}
.dash-ring{position:relative; width:96px; height:96px; flex:none;}
.dash-ring svg{transform:rotate(-90deg);}
.dash-ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800;}

.continue-card{display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; padding:28px;}
.continue-meta{font-size:12px; color:var(--text-muted); font-weight:600; margin-bottom:8px; letter-spacing:.03em;}
.continue-title{font-size:22px; font-weight:700; margin-bottom:6px;}
.continue-time{font-size:13px; color:var(--text-secondary);}

.skills-grid{display:grid; gap:16px;}
.skill-row{display:grid; grid-template-columns:150px 1fr 40px; align-items:center; gap:16px;}
@media(max-width:520px){.skill-row{grid-template-columns:100px 1fr 34px;}}
.skill-row .name{font-size:13.5px; font-weight:600;}
.skill-row .pct{font-size:13px; font-weight:700; text-align:right; color:var(--text-secondary);}

.grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:24px;}
@media(max-width:900px){.grid-2{grid-template-columns:1fr;}}

/* ============================================================
   ROADMAP
============================================================ */
.timeline{position:relative; padding-left:44px;}
.timeline::before{content:'';position:absolute; left:15px; top:8px; bottom:8px; width:1px; background:var(--border);}
.tl-item{position:relative; padding-bottom:36px; cursor:pointer;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute; left:-44px; top:2px; width:31px; height:31px; border-radius:50%; border:1px solid var(--border-strong); background:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; transition:all .2s;}
.tl-item.done .tl-dot{background:#000; border-color:#000; color:#fff;}
.tl-item.current .tl-dot{background:#fff; border-color:#000; color:#000; box-shadow:0 0 0 4px var(--bg-soft);}
.tl-item.locked .tl-dot{color:var(--text-muted);}
.tl-body{padding:2px 0 2px 4px; border-radius:var(--r-md); transition:background .15s;}
.tl-item:hover .tl-body{background:var(--bg-soft);}
.tl-body{padding:10px 14px;}
.tl-title{font-size:16px; font-weight:700; margin-bottom:3px;}
.tl-item.locked .tl-title{color:var(--text-muted);}
.tl-desc{font-size:13.5px; color:var(--text-secondary);}
.tl-meta{font-size:11.5px; color:var(--text-muted); margin-top:6px; font-weight:600;}

/* ============================================================
   LESSON
============================================================ */
.lesson-header{border-bottom:1px solid var(--border); padding:28px 0;}
.lesson-eyebrow{display:flex; align-items:center; gap:10px; margin-bottom:14px; font-size:12.5px; font-weight:700; color:var(--text-muted);}
.lesson-title{font-size:clamp(28px,4vw,40px); font-weight:800; margin-bottom:8px; letter-spacing:-.02em;}
.lesson-sub{font-size:15px; color:var(--text-secondary); margin-bottom:20px;}
.lesson-progress{display:flex; align-items:center; gap:14px;}
.step-nav{display:flex; gap:6px; flex:1;}
.step-pill{flex:1; height:4px; background:var(--border); border-radius:999px; overflow:hidden;}
.step-pill.done .fill, .step-pill.current .fill{width:100%;}
.step-pill .fill{height:100%; width:0; background:#000; transition:width .3s;}
.step-labels{display:flex; justify-content:space-between; margin-top:10px; font-size:11px; font-weight:700; color:var(--text-muted); letter-spacing:.03em; text-transform:uppercase;}
.step-labels span.current{color:#000;}

.lesson-body{padding:48px 0 80px;}
.lesson-stage{min-height:340px;}
.stage-label{font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin-bottom:18px;}
.prompt-q{font-size:clamp(22px,3vw,30px); font-weight:700; margin-bottom:18px; letter-spacing:-.01em;}
.explain-block{margin:22px 0; padding:20px 22px; background:var(--bg-soft); border-radius:var(--r-md); font-size:14.5px; line-height:1.6; color:#333;}
.explain-block b{color:#000;}
.go-deeper{margin-top:16px; border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden;}
.go-deeper summary{padding:14px 18px; font-size:13px; font-weight:700; cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px;}
.go-deeper summary::-webkit-details-marker{display:none;}
.go-deeper[open] summary{border-bottom:1px solid var(--border);}
.go-deeper .gd-body{padding:16px 18px; font-size:14px; color:var(--text-secondary); line-height:1.6;}

.lesson-footer{display:flex; justify-content:space-between; align-items:center; margin-top:44px; padding-top:24px; border-top:1px solid var(--border);}

.term-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:20px;}
@media(max-width:700px){.term-grid{grid-template-columns:1fr 1fr;}}
.term{border:1px solid var(--border); border-radius:var(--r-md); padding:16px;}
.term .t{font-size:12px; font-weight:800; letter-spacing:.04em; margin-bottom:6px;}
.term .d{font-size:12.5px; color:var(--text-secondary); line-height:1.4;}

/* mini ui preview components used across lessons */
.ui-preview{border:1px solid var(--border); border-radius:var(--r-lg); padding:24px; background:#fff;}
.ui-nav{display:flex; justify-content:space-between; align-items:center; padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid var(--ui-border,var(--border));}
.ui-nav .b{font-weight:800; font-size:13px;}
.ui-btn{padding:9px 18px; border-radius:8px; font-size:12.5px; font-weight:700; border:none; display:inline-block;}
.ui-card{border:1px solid var(--ui-border,var(--border)); border-radius:10px; padding:14px; margin-bottom:10px;}
.ui-card .t{font-weight:700; font-size:13px; margin-bottom:4px;}
.ui-card .d{font-size:12px; color:var(--text-muted);}
.ui-badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700;}
.ui-alert{padding:12px 14px; border-radius:8px; font-size:12.5px; font-weight:600; display:flex; gap:8px; align-items:center;}
.ui-input{border:1px solid var(--ui-border,var(--border)); border-radius:8px; padding:10px 12px; font-size:12.5px; color:var(--text-muted); margin-bottom:10px;}

/* color wheel */
.wheel-area{display:flex; gap:40px; flex-wrap:wrap; align-items:center;}
.wheel-outer{position:relative; width:260px; height:260px; flex:none;}
.wheel{width:100%; height:100%; border-radius:50%; position:relative; touch-action:none; box-shadow:0 0 0 1px var(--border);}
.wheel-handle{position:absolute; width:22px; height:22px; border-radius:50%; background:#fff; border:3px solid #000; transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,.2); cursor:grab;}
.wheel-info{flex:1; min-width:240px;}
.color-name{font-size:26px; font-weight:800; margin-bottom:16px;}

/* HSL lab */
.lab-grid{display:grid; grid-template-columns:220px 1fr; gap:40px; align-items:start;}
@media(max-width:700px){.lab-grid{grid-template-columns:1fr;}}
.lab-preview{width:100%; aspect-ratio:1; border-radius:var(--r-lg); box-shadow:0 0 0 1px var(--border);}

/* harmony */
.harmony-palette{display:flex; gap:10px; margin:22px 0;}
.harmony-sw{flex:1; aspect-ratio:1; border-radius:var(--r-md); box-shadow:0 0 0 1px var(--border); position:relative; overflow:hidden;}
.harmony-sw .lbl{position:absolute; bottom:6px; left:6px; right:6px; font-size:9.5px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.4);}

/* contrast */
.contrast-demo{display:flex; align-items:center; justify-content:center; border-radius:var(--r-lg); padding:50px 24px; min-height:170px; text-align:center; transition:background .2s, color .2s;}
.contrast-demo .big{font-size:22px; font-weight:700;}
.ratio-badge{display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px; font-weight:800; font-size:14px; margin-top:16px;}
.ratio-badge.pass{background:#DCFCE7; color:#166534;}
.ratio-badge.fail{background:#FEE2E2; color:#991B1B;}
.pass-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px;}
.pass-item{border:1px solid var(--border); border-radius:var(--r-sm); padding:10px; text-align:center; font-size:11.5px;}
.pass-item .lv{font-weight:800; font-size:13px; margin-top:2px;}
.pass-item.ok{background:#F0FDF4;}
.pass-item.no{background:#FEF2F2;}

/* quiz */
.quiz-card{max-width:640px; margin:0 auto;}
.quiz-progress{text-align:center; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:8px;}
.quiz-q{font-size:clamp(20px,3vw,26px); font-weight:700; text-align:center; margin-bottom:28px; line-height:1.3;}
.quiz-options{display:grid; gap:10px;}
.quiz-opt{border:1px solid var(--border-strong); border-radius:var(--r-md); padding:16px 18px; font-size:14.5px; font-weight:600; text-align:left; background:#fff; transition:all .15s;}
.quiz-opt:hover{border-color:#000;}
.quiz-opt.correct{border-color:var(--success); background:#F0FDF4;}
.quiz-opt.incorrect{border-color:var(--error); background:#FEF2F2;}
.quiz-opt.dim{opacity:.5;}
.quiz-swatch-opt{display:flex; align-items:center; gap:12px;}
.quiz-swatch-opt .sw{width:28px; height:28px; border-radius:6px; box-shadow:0 0 0 1px var(--border); flex:none;}
.quiz-feedback{margin-top:20px; padding:18px 20px; border-radius:var(--r-md); font-size:14px; line-height:1.5;}
.quiz-feedback.correct{background:#F0FDF4; color:#14532D;}
.quiz-feedback.incorrect{background:#FEF2F2; color:#7F1D1D;}
.quiz-feedback .verdict{font-weight:800; margin-bottom:4px; font-size:15px;}
.xp-toast{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; background:#000; color:#fff; padding:4px 10px; border-radius:999px; margin-left:8px;}

/* playground */
.playground-grid{display:grid; grid-template-columns:340px 1fr; gap:40px;}
@media(max-width:900px){.playground-grid{grid-template-columns:1fr;}}
.pg-preview{border-radius:var(--r-lg); min-height:320px; box-shadow:0 0 0 1px var(--border); position:relative; overflow:hidden;}
.pg-actions{display:flex; gap:10px; margin-top:20px;}
.saved-row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
.saved-chip{display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:999px; padding:6px 12px 6px 6px; font-size:12px; font-weight:600;}
.saved-chip .sw{width:18px; height:18px; border-radius:50%;}

/* tests */
.test-card{display:flex; justify-content:space-between; align-items:center; padding:22px 24px; gap:16px; flex-wrap:wrap;}
.test-card .meta{font-size:12.5px; color:var(--text-muted); margin-top:4px;}

/* achievements */
.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px;}
.badge{border:1px solid var(--border); border-radius:var(--r-lg); padding:20px 14px; text-align:center; transition:all .2s;}

/* ============================================================
   COLOR UTILITIES
============================================================ */
function clamp(n,a,b){return Math.min(b,Math.max(a,n));}
function hslToRgb(h,s,l){
  h=((h%360)+360)%360; s=clamp(s,0,100)/100; l=clamp(l,0,100)/100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0,s=0,l=(max+min)/2;
  if(max!==min){
    const d=max-min;
    s=l>0.5? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=(g-b)/d+(g<b?6:0); break;
      case g: h=(b-r)/d+2; break;
      case b: h=(r-g)/d+4; break;
    }
    h*=60;
  }
  return [Math.round(h),Math.round(s*100),Math.round(l*100)];
}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join('').toUpperCase();}
function hexToRgb(hex){
  hex=hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const num=parseInt(hex,16);
  return [(num>>16)&255,(num>>8)&255,num&255];
}
function hslToHex(h,s,l){const [r,g,b]=hslToRgb(h,s,l); return rgbToHex(r,g,b);}
function hexToHsl(hex){const [r,g,b]=hexToRgb(hex); return rgbToHsl(r,g,b);}
function relLuminance(hex){
  let [r,g,b]=hexToRgb(hex).map(v=>{v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*r+0.7152*g+0.0722*b;
}
function contrastRatio(hex1,hex2){
  const L1=relLuminance(hex1), L2=relLuminance(hex2);
  const light=Math.max(L1,L2), dark=Math.min(L1,L2);
  return (light+0.05)/(dark+0.05);
}
function nameForHue(h){
  const names=[[15,'Red'],[45,'Orange'],[70,'Yellow'],[170,'Green'],[200,'Cyan'],[255,'Blue'],[290,'Purple'],[330,'Magenta'],[361,'Red']];
  for(const [max,name] of names) if(h<=max) return name;
  return 'Red';
}
function simulateBlind(hex,type){
  // simplified simulation matrices (Brettel-ish approximation)
  const [r,g,b]=hexToRgb(hex);
  const M={
    protanopia:[[0.567,0.433,0],[0.558,0.442,0],[0,0.242,0.758]],
    deuteranopia:[[0.625,0.375,0],[0.7,0.3,0],[0,0.3,0.7]],
    tritanopia:[[0.95,0.05,0],[0,0.433,0.567],[0,0.475,0.525]],
    normal:[[1,0,0],[0,1,0],[0,0,1]]
  }[type]||[[1,0,0],[0,1,0],[0,0,1]];
  const nr=r*M[0][0]+g*M[0][1]+b*M[0][2];
  const ng=r*M[1][0]+g*M[1][1]+b*M[1][2];
  const nb=r*M[2][0]+g*M[2][1]+b*M[2][2];
  return rgbToHex(nr,ng,nb);
}
function harmonyPalette(baseHex,type){
  const [h,s,l]=hexToHsl(baseHex);
  const mk=hh=>hslToHex(hh,s,l);
  switch(type){
    case 'mono': return [hslToHex(h,s,Math.max(l-30,8)),hslToHex(h,s,Math.max(l-15,15)),baseHex,hslToHex(h,Math.max(s-25,10),Math.min(l+18,92)),hslToHex(h,Math.max(s-45,5),Math.min(l+34,96))];
    case 'analogous': return [mk(h-30),mk(h-15),baseHex,mk(h+15),mk(h+30)];
    case 'complementary': return [hslToHex(h,s,Math.max(l-18,10)),baseHex,hslToHex(h,Math.max(s-30,10),Math.min(l+20,90)),mk(h+180),hslToHex(h+180,s,Math.max(l-18,10))];
    case 'splitcomp': return [baseHex,mk(h+150),mk(h+210),hslToHex(h,Math.max(s-30,10),Math.min(l+22,90)),hslToHex(h,s,Math.max(l-18,10))];
    case 'triadic': return [baseHex,mk(h+120),mk(h+240),hslToHex(h,Math.max(s-30,10),Math.min(l+22,90)),hslToHex(h,s,Math.max(l-18,10))];
    case 'tetradic': return [baseHex,mk(h+90),mk(h+180),mk(h+270),hslToHex(h,Math.max(s-30,10),Math.min(l+22,90))];
    default: return [baseHex];
  }
}

function bindLandingOrb(){
  const wrap=document.getElementById('orbWrap');
  const orb=document.getElementById('orb');
  const split=document.getElementById('orbSplit');
  if(!wrap) return;
  let clicked=false;
  function onMove(e){
    if(clicked) return;
    const rect=wrap.getBoundingClientRect();
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    const clientX = e.touches? e.touches[0].clientX : e.clientX;
    const clientY = e.touches? e.touches[0].clientY : e.clientY;
    const dx=clientX-cx, dy=clientY-cy;
    const dist=Math.min(Math.sqrt(dx*dx+dy*dy),300);
    const angle=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
    const sat=clamp(100-dist/3,20,90);
    orb.style.background=`hsl(${angle},${sat}%,50%)`;
  }
  document.addEventListener('mousemove',onMove);
  wrap.addEventListener('click',()=>{
    clicked=true;
    orb.style.background='#000';
    orb.style.transform='scale(.9)';
    split.classList.add('show');
    setTimeout(()=>{
      orb.style.transform='scale(1)';
    },250);
    setTimeout(()=>{
      split.classList.remove('show');
      clicked=false;
    },2400);
  });
  wrap.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); wrap.click();} });
}

/* ============================================================
   LESSON EVENT BINDING
============================================================ */
function bindLessonEvents(lesson,step){
  document.getElementById('lessonBack')?.addEventListener('click',()=>{
    state.step=Math.max(0,state.step-1); state.lessonSubStep=0; render();
  });
  document.getElementById('lessonNext')?.addEventListener('click',()=>{
    if(state.step<STEPS.length-1){
      if(state.step===2){ state.quizIndex=0; state.quizScore=0; state.quizAnswered=false; state.quizSelected=null; }
      state.step++; state.lessonSubStep=0; render();
    } else {
      if(!state.completedLessons.has(lesson.id)){
        state.completedLessons.add(lesson.id);
        addXP(50);
        if(lesson.id===state.currentLessonHighlight && lesson.id<12) state.currentLessonHighlight=lesson.id+1;
      }
      render();
    }
  });
  document.getElementById('nextLessonBtn')?.addEventListener('click',()=>{
    openLesson(lesson.id+1);
  });

  // orb hero not relevant here
  // lesson 1
  document.getElementById('addColorBtn')?.addEventListener('click',()=>{ state.lessonSubStep=1; render(); });
  document.getElementById('psychToggle')?.addEventListener('click',()=>{ state.lessonSubStep=state.lessonSubStep?0:1; render(); });
  document.querySelectorAll('[data-industry]').forEach(b=>b.addEventListener('click',()=>{ state.projectIndustryPsych=b.getAttribute('data-industry'); render(); }));

  // lesson 2 wheel
  const wheelOuter=document.querySelector('.wheel-outer');
  if(wheelOuter){
    positionWheelHandle();
    let dragging=false;
    function setFromEvent(clientX,clientY){
      const wheel=document.getElementById('wheelEl');
      const rect=wheel.getBoundingClientRect();
      const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
      const angle=(Math.atan2(clientY-cy,clientX-cx)*180/Math.PI+90+360)%360;
      state.wheelHue=Math.round(angle);
      updateWheelReadout();
      positionWheelHandle();
    }
    const wheel=document.getElementById('wheelEl');
    wheel.addEventListener('pointerdown',e=>{dragging=true; setFromEvent(e.clientX,e.clientY);});
    window.addEventListener('pointermove',e=>{if(dragging) setFromEvent(e.clientX,e.clientY);});
    window.addEventListener('pointerup',()=>dragging=false);
    wheel.setAttribute('tabindex','0');
    wheel.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'){state.wheelHue=(state.wheelHue+5)%360; updateWheelReadout(); positionWheelHandle();}
      if(e.key==='ArrowLeft'){state.wheelHue=(state.wheelHue-5+360)%360; updateWheelReadout(); positionWheelHandle();}
    });
  }
  document.querySelectorAll('[data-hue]').forEach(b=>b.addEventListener('click',()=>{
    state.wheelHue=parseInt(b.getAttribute('data-hue')); render();
  }));

  // lesson 3 lab
  ['labH','labS','labL'].forEach(id=>{
    document.getElementById(id)?.addEventListener('input',e=>{
      const key=id.replace('lab','').toLowerCase()==='h'?'labH':id==='labS'?'labS':'labL';
      state[key]=parseInt(e.target.value);
      updateLabPreview();
    });
  });
  document.querySelectorAll('[data-lab-preset]').forEach(b=>b.addEventListener('click',()=>{
    const p=b.getAttribute('data-lab-preset');
    if(p==='tint') state.labL=Math.min(state.labL+25,95);
    if(p==='shade') state.labL=Math.max(state.labL-25,5);
    if(p==='tone') state.labS=Math.max(state.labS-30,5);
    render();
  }));

  // lesson 4 harmony
  document.querySelectorAll('[data-harmony]').forEach(b=>b.addEventListener('click',()=>{
    state.harmonyType=b.getAttribute('data-harmony'); render();
  }));
  document.getElementById('harmonyBaseInput')?.addEventListener('input',e=>{
    state.harmonyBase=e.target.value.toUpperCase(); render();
  });

  // lesson 6 system
  document.querySelectorAll('[data-sys-color]').forEach(inp=>inp.addEventListener('input',e=>{
    state.sysColors[inp.getAttribute('data-sys-color')]=e.target.value; render();
  }));

  // lesson 7 contrast
  document.getElementById('contrastTextInput')?.addEventListener('input',e=>{ state.contrastText=e.target.value; updateContrast(); });
  document.getElementById('contrastBgInput')?.addEventListener('input',e=>{ state.contrastBg=e.target.value; updateContrast(); });
  document.querySelectorAll('[data-cb]').forEach(b=>b.addEventListener('click',()=>{ state.cbType=b.getAttribute('data-cb'); render(); }));

  // lesson 8 hierarchy
  document.getElementById('hColor')?.addEventListener('input',e=>{ state.hierarchyColor=parseInt(e.target.value); render(); });
  document.getElementById('hSize')?.addEventListener('input',e=>{ state.hierarchySize=parseInt(e.target.value); render(); });
  document.getElementById('hContrast')?.addEventListener('input',e=>{ state.hierarchyContrast=parseInt(e.target.value); render(); });

  // lesson 9 states
  document.querySelectorAll('[data-state-idx]').forEach(b=>b.addEventListener('click',()=>{
    state.lessonSubStep=parseInt(b.getAttribute('data-state-idx')); render();
  }));
  document.getElementById('stateColorInput')?.addEventListener('input',e=>{
    const active=UI_STATES[state.lessonSubStep||0];
    state.statesColors[active]=e.target.value; render();
  });

  // lesson 11 project
  document.querySelectorAll('[data-project]').forEach(b=>b.addEventListener('click',()=>{ state.projectIndustry=b.getAttribute('data-project'); render(); }));
  document.querySelectorAll('[data-proj-color]').forEach(inp=>inp.addEventListener('input',e=>{
    state.projectColors[inp.getAttribute('data-proj-color')]=e.target.value; render();
  }));

  // lesson 12 challenge
  document.querySelectorAll('[data-fix]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.getAttribute('data-fix');
    if(state.challengeFixed.has(id)) state.challengeFixed.delete(id); else state.challengeFixed.add(id);
    render();
  }));

  // quiz
  document.querySelectorAll('[data-quiz-opt]').forEach(b=>b.addEventListener('click',()=>{
    const qs=QUESTIONS.filter(q=>q.lesson===lesson.id);
    const q=qs[state.quizIndex];
    const i=parseInt(b.getAttribute('data-quiz-opt'));
    state.quizAnswered=true; state.quizSelected=i;
    if(i===q.correct){ state.quizScore++; addXP(q.xp); } 
    render();
  }));
  document.getElementById('quizContinue')?.addEventListener('click',()=>{
    const qs=QUESTIONS.filter(q=>q.lesson===lesson.id);
    if(state.quizIndex<qs.length-1){
      state.quizIndex++; state.quizAnswered=false; state.quizSelected=null; render();
    } else {
      state.step=4; render();
    }
  });
}
function updateWheelReadout(){
  const hex=hslToHex(state.wheelHue,state.wheelSat,state.wheelLight);
  const [r,g,b]=hslToRgb(state.wheelHue,state.wheelSat,state.wheelLight);
  const nameEl=document.getElementById('colorName');
  if(nameEl){ nameEl.textContent=nameForHue(state.wheelHue); nameEl.style.color=hex; }
  const hueEl=document.getElementById('wHue'); if(hueEl) hueEl.textContent=state.wheelHue+'°';
  const hexEl=document.getElementById('wHex'); if(hexEl) hexEl.textContent=hex;
  const rgbEl=document.getElementById('wRgb'); if(rgbEl) rgbEl.textContent=`${r}, ${g}, ${b}`;
  const hslEl=document.getElementById('wHsl'); if(hslEl) hslEl.textContent=`${state.wheelHue}, ${state.wheelSat}%, ${state.wheelLight}%`;
}
function updateLabPreview(){
  const hex=hslToHex(state.labH,state.labS,state.labL);
  const [r,g,b]=hslToRgb(state.labH,state.labS,state.labL);
  document.getElementById('labPreview').style.background=hex;
  document.getElementById('labHex').textContent=hex;
  document.getElementById('labRgb').textContent=`${r}, ${g}, ${b}`;
  document.getElementById('labHsl').textContent=`${state.labH}, ${state.labS}%, ${state.labL}%`;
  document.getElementById('labHVal').textContent=state.labH+'°';
  document.getElementById('labSVal').textContent=state.labS+'%';
  document.getElementById('labLVal').textContent=state.labL+'%';
}
function updateContrast(){
  const demo=document.getElementById('contrastDemo');
  demo.style.background=state.contrastBg; demo.style.color=state.contrastText;
  const ratio=contrastRatio(state.contrastText,state.contrastBg);
  const badge=document.getElementById('ratioBadge');
  const aa=ratio>=4.5;
  badge.textContent=`${ratio.toFixed(1)} : 1 — ${aa?'PASS':'FAIL'}`;
  badge.className='ratio-badge '+(aa?'pass':'fail');
  render(); // simplest: full re-render to update pass grid too
}

const MOCK_TESTS=[
  {id:1,title:'Color Fundamentals',count:'20 questions',pass:70},
  {id:2,title:'Color in UX',count:'20 questions',pass:70},
  {id:3,title:'UX Color Audit',count:'Visual analysis',pass:70},
];
function testsView(){
  return `
  <section class="wrap" style="padding-top:56px; padding-bottom:80px;">
    <div class="eyebrow" style="margin-bottom:10px;">ASSESSMENTS</div>
    <h1 class="headline-lg" style="margin-bottom:40px;">Tests</h1>
    <div style="display:grid; gap:14px;">
      ${MOCK_TESTS.map(t=>{
        const result=state.testResults[t.id];
        return `<div class="card test-card">
          <div>
            <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;">MOCK TEST ${String(t.id).padStart(2,'0')}</div>
            <div style="font-size:19px;font-weight:700;">${t.title}</div>
            <div class="meta">${t.count} · Pass at ${t.pass}%${result!==null&&result!==undefined?` · Last score ${result}%`:''}</div>
          </div>
          <button class="btn btn-primary" data-start-test="${t.id}">${result!==null&&result!==undefined?'RETAKE':'START →'}</button>
        </div>`;
      }).join('')}
    </div>
  </section>`;
}
function testTakingView(){
  const t=MOCK_TESTS.find(m=>m.id===state.activeTestId);
  const qs=QUESTIONS; // pooled bank as the "20 questions" sample
  const idx=clamp(state.testIndex,0,qs.length-1);
  if(state.testIndex>=qs.length){
    const correct=Object.values(state.testAnswered).filter(v=>v.correct).length;
    const pct=Math.round((correct/qs.length)*100);
    state.testResults[t.id]=pct;
    const weak=Object.entries(
      qs.reduce((acc,q)=>{ const a=state.testAnswered[q.id]; if(a && !a.correct){ const l=LESSONS.find(ls=>ls.id===q.lesson); acc[l.title]=(acc[l.title]||0)+1;} return acc;},{})
    ).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
    return `<section class="wrap" style="padding-top:56px; text-align:center;">
      <div class="eyebrow" style="margin-bottom:10px;">RESULT</div>
      <h1 class="headline-lg">${pct}%</h1>
      <p class="body-lg" style="margin:12px 0 30px;">${pct>=t.pass?'You passed.':'Not quite — review the concepts below.'}</p>
      <div class="grid-2" style="text-align:left; max-width:640px; margin:0 auto;">
        <div class="card"><div class="stage-label">CORRECT</div><div class="headline-md">${correct} / ${qs.length}</div></div>
        <div class="card"><div class="stage-label">WEAK AREAS</div>${weak.length?weak.map(w=>`<div class="body-md">• ${w}</div>`).join(''):'<div class="body-md">None — great work.</div>'}</div>
      </div>
      <div style="margin-top:32px;"><button class="btn btn-primary" data-nav="tests">BACK TO TESTS</button></div>
    </section>`;
  }
  const q=qs[idx];
  const answered=state.testAnswered[q.id];
  return `<section class="wrap" style="padding-top:56px;">
    <div class="quiz-card">
      <div class="quiz-progress">${idx+1} / ${qs.length} · ${t.title.toUpperCase()}</div>
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-options">
        ${q.options.map((opt,i)=>{
          let cls='quiz-opt';
          if(answered){ if(i===q.correct) cls+=' correct'; else if(i===answered.sel) cls+=' incorrect'; else cls+=' dim'; }
          return `<button class="${cls}" data-test-opt="${i}" ${answered?'disabled':''}>${opt}</button>`;
        }).join('')}
      </div>
      ${answered?`<div style="text-align:center;margin-top:24px;"><button class="btn btn-primary" id="testContinue">${idx<qs.length-1?'Continue →':'See results →'}</button></div>`:''}
    </div>
  </section>`;
}
function bindTests(){
  document.querySelectorAll('[data-start-test]').forEach(b=>b.addEventListener('click',()=>{
    state.activeTestId=parseInt(b.getAttribute('data-start-test'));
    state.testIndex=0; state.testAnswered={};
    nav('testtaking');
  }));
}
function bindTestTaking(){
  document.querySelectorAll('[data-test-opt]').forEach(b=>b.addEventListener('click',()=>{
    const qs=QUESTIONS;
    const q=qs[state.testIndex];
    const i=parseInt(b.getAttribute('data-test-opt'));
    state.testAnswered[q.id]={sel:i,correct:i===q.correct};
    render();
  }));
  document.getElementById('testContinue')?.addEventListener('click',()=>{ state.testIndex++; render(); });
}

/* ============================================================
   VIEW-SPECIFIC BIND ROUTER
============================================================ */
function bindView(){
  document.querySelectorAll('[data-open-lesson]').forEach(el=>el.addEventListener('click',()=>{
    openLesson(parseInt(el.getAttribute('data-open-lesson')));
  }));
  if(state.view==='landing') bindLandingOrb();
  if(state.view==='lesson'){
    const lesson=LESSONS.find(l=>l.id===state.lessonId)||LESSONS[0];
    bindLessonEvents(lesson,state.step);
    if(state.step===1||state.step===2){
      // reposition wheel on resize
      setTimeout(()=>positionWheelHandle(),0);
    }
  }
  if(state.view==='playground') bindPlayground();
  if(state.view==='tests') bindTests();
  if(state.view==='testtaking') bindTestTaking();
}

/* init */
render();
window.addEventListener('resize',()=>{ if(state.view==='lesson') positionWheelHandle(); });
